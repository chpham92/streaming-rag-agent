# KRaft mode (no ZooKeeper) — single broker, single node, intentionally
# minimal for local dev. Real Apache Kafka, not a wire-compatible substitute:
# credibility with this exact JD requirement matters more here than the
# operational conveniences a substitute would offer.
services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9094
      # Two advertised listeners: PLAINTEXT for other containers on the
      # compose network (reach it as `kafka:9092`), PLAINTEXT_HOST for
      # anything running directly on the Mac (reach it as `localhost:9094`).
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false" # topics are created explicitly by kafka-init — see its command
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:3.7.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic tickets.raw --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic tickets.indexed --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
      "

  producer:
    build: ./producer
    container_name: ticket-producer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TOPIC: tickets.raw
      EVENTS_PER_MINUTE: "6"

  spark-indexer:
    build: ./pipeline
    container_name: spark-indexer
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      SOURCE_TOPIC: tickets.raw
      SINK_TOPIC: tickets.indexed
      PINECONE_INDEX: support-tickets
      # Real secrets pulled from the shell's environment, never hardcoded —
      # same pattern as fitness-agent's k8s/secret.example.yaml. Run with
      # `OPENAI_API_KEY=... PINECONE_API_KEY=... docker compose up` or export
      # them first; docker compose reads them from the host shell here.
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in your shell before starting this service}
      PINECONE_API_KEY: ${PINECONE_API_KEY:?set PINECONE_API_KEY in your shell before starting this service}

  triage-agent:
    build: ./agent
    container_name: triage-agent
    # Belt-and-suspenders with the per-message try/except in triage_agent.py:
    # that handles a bad decision on one ticket, this handles anything that
    # try/except doesn't (a Kafka client crash, an OOM) by restarting the
    # process rather than leaving the consumer group silently dead.
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9200:9200" # /metrics — scraped by prometheus, exposed to the host too for a quick curl check
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      SOURCE_TOPIC: tickets.indexed
      PINECONE_INDEX: support-tickets
      TRIAGE_AGENT_MODEL: claude-opus-5
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in your shell before starting this service}
      PINECONE_API_KEY: ${PINECONE_API_KEY:?set PINECONE_API_KEY in your shell before starting this service}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in your shell before starting this service}

  # --- observability stack ---------------------------------------------
  # kafka-exporter, not the Kafka broker's own JMX metrics: it exposes
  # per-consumer-group lag directly (kafka_consumergroup_lag) instead of
  # requiring a separate JMX-to-Prometheus translation layer just to get
  # the one number (agent lag) that actually matters for this demo.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: kafka-exporter
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "9308:9308"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - triage-agent
      - kafka-exporter

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    depends_on:
      - alert-receiver

  # Stands in for a real incident-response destination (PagerDuty, Slack) —
  # see monitoring/receiver/receiver.py. Logs every alert's full lifecycle
  # (firing -> resolved), so an alert firing is provable from `docker logs
  # alert-receiver` rather than only from the Alertmanager UI's snapshot view.
  alert-receiver:
    build: ./monitoring/receiver
    container_name: alert-receiver
    ports:
      - "9100:9100"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin # local-only demo box, not a shared/production Grafana — anonymous admin trades a login screen for zero-friction access to the one dashboard that exists
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
