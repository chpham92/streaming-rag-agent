global:
  scrape_interval: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: triage-agent
    static_configs:
      - targets: ["triage-agent:9200"]

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
